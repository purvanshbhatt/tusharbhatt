<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 900" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050e21" />
      <stop offset="45%" stop-color="#0a1c3d" />
      <stop offset="100%" stop-color="#071329" />
    </linearGradient>

    <!-- Metallic Gold Gradient Primary -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cf9f38" />
      <stop offset="25%" stop-color="#fdf1c8" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="75%" stop-color="#aa7c19" />
      <stop offset="100%" stop-color="#e8c872" />
    </linearGradient>

    <!-- Metallic Gold Gradient Light -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff4db" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#9a6e12" />
    </linearGradient>

    <!-- Drop Shadow Filter for Luxury Emboss -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&amp;family=Playfair+Display:ital,wght@0,600;0,700;1,600&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=Rozha+One&amp;family=Yatra+One&amp;display=swap');
    .serif-title { font-family: 'Cinzel', 'Playfair Display', serif; font-weight: 800; }
    .serif-sub { font-family: 'Playfair Display', serif; }
    .sans { font-family: 'Plus Jakarta Sans', sans-serif; }
    .hindi { font-family: 'Plus Jakarta Sans', 'Noto Sans Devanagari', sans-serif; font-weight: 700; }
  </style>

  <!-- Background Base -->
  <rect width="2400" height="900" fill="url(#bgGradient)" />

  <!-- Outer Luxurious Double Gold Border -->
  <rect x="25" y="25" width="2350" height="850" rx="8" fill="none" stroke="url(#goldGradient)" stroke-width="4" opacity="0.9" />
  <rect x="37" y="37" width="2326" height="826" rx="4" fill="none" stroke="url(#goldGradient)" stroke-width="1.5" opacity="0.45" />

  <!-- Corner Filigree Ornaments -->
  <!-- Top Left -->
  <path d="M 45 75 L 75 45 M 45 105 L 105 45 M 45 45 L 120 45 M 45 45 L 45 120" stroke="url(#goldGradient)" stroke-width="2" fill="none" opacity="0.75" />
  <!-- Top Right -->
  <path d="M 2355 75 L 2325 45 M 2355 105 L 2295 45 M 2355 45 L 2280 45 M 2355 45 L 2355 120" stroke="url(#goldGradient)" stroke-width="2" fill="none" opacity="0.75" />
  <!-- Bottom Left -->
  <path d="M 45 825 L 75 855 M 45 795 L 105 855 M 45 855 L 120 855 M 45 855 L 45 780" stroke="url(#goldGradient)" stroke-width="2" fill="none" opacity="0.75" />
  <!-- Bottom Right -->
  <path d="M 2355 825 L 2325 855 M 2355 795 L 2295 855 M 2355 855 L 2280 855 M 2355 855 L 2355 780" stroke="url(#goldGradient)" stroke-width="2" fill="none" opacity="0.75" />

  <!-- LEFT EMBLEM: Scales of Justice in Golden Medallion -->
  <g transform="translate(160, 240)">
    <!-- Outer Medallion Circle -->
    <circle cx="100" cy="110" r="105" fill="none" stroke="url(#goldGradient)" stroke-width="3.5" opacity="0.8" />
    <circle cx="100" cy="110" r="95" fill="#071733" stroke="url(#goldGradient)" stroke-width="1.2" opacity="0.5" />
    
    <!-- Scales of Justice Icon -->
    <g transform="translate(40, 50)" fill="url(#goldGradient)" filter="url(#subtleShadow)">
      <!-- Central Pillar & Base -->
      <path d="M 60 10 L 60 115 L 40 120 L 80 120 L 60 115 Z" />
      <circle cx="60" cy="10" r="7" />
      <!-- Beam -->
      <path d="M 12 28 Q 60 18 108 28 L 108 34 Q 60 24 12 34 Z" />
      <!-- Left Pan strings & bowl -->
      <line x1="16" y1="32" x2="2" y2="65" stroke="url(#goldGradient)" stroke-width="2" />
      <line x1="28" y1="32" x2="42" y2="65" stroke="url(#goldGradient)" stroke-width="2" />
      <path d="M 0 65 Q 22 90 44 65 Z" />
      <!-- Right Pan strings & bowl -->
      <line x1="92" y1="32" x2="78" y2="65" stroke="url(#goldGradient)" stroke-width="2" />
      <line x1="104" y1="32" x2="118" y2="65" stroke="url(#goldGradient)" stroke-width="2" />
      <path d="M 76 65 Q 98 90 120 65 Z" />
    </g>
    <!-- Badge Below Emblem -->
    <text x="100" y="240" text-anchor="middle" class="sans" font-size="16" font-weight="800" fill="#fdf1c8" letter-spacing="3">ESTD. 1999</text>
    <text x="100" y="260" text-anchor="middle" class="sans" font-size="13" font-weight="700" fill="#cf9f38" letter-spacing="2">25+ YRS PRACTICE</text>
  </g>

  <!-- TOP BAR: Judicial Jurisdiction Ribbon -->
  <g transform="translate(420, 105)">
    <rect x="0" y="0" width="1860" height="42" rx="6" fill="rgba(212, 175, 55, 0.08)" stroke="url(#goldGradient)" stroke-width="1" />
    <text x="930" y="27" text-anchor="middle" class="sans" font-size="19" font-weight="700" fill="url(#goldLight)" letter-spacing="3.5">
      HIGH COURT OF MADHYA PRADESH (INDORE BENCH) • DISTRICT &amp; SESSIONS JUDICIARY (UJJAIN • JHABUA • THANDLA)
    </text>
  </g>

  <!-- MAIN NAME HEADER -->
  <!-- English & Hindi Dominant Identity -->
  <g transform="translate(420, 240)">
    <!-- Hindi Super-heading -->
    <text x="0" y="-10" class="hindi" font-size="28" fill="#d4af37" letter-spacing="2">
      || विधिक परामर्शदाता एवं वरिष्ठ अभिभाषक ||
    </text>

    <!-- Main English Name -->
    <text x="0" y="70" class="serif-title" font-size="78" fill="url(#goldGradient)" filter="url(#goldGlow)" letter-spacing="2.5">
      ADVOCATE TUSHAR Y. BHATT
    </text>
    <text x="0" y="118" class="hindi" font-size="34" fill="#ffffff" letter-spacing="1">
      अभिभाषक तुषार वाय. भट्ट <tspan fill="#cf9f38" font-size="28">(तुषार राव भट्ट)</tspan>
    </text>

    <!-- Credentials / Qualification Tag -->
    <g transform="translate(0, 142)">
      <rect x="0" y="0" width="680" height="34" rx="4" fill="rgba(255,255,255,0.08)" stroke="rgba(212, 175, 55, 0.4)" stroke-width="1" />
      <text x="18" y="23" class="sans" font-size="17" font-weight="700" fill="#fdf1c8" letter-spacing="2">
        B.Sc., LL.B. • 25+ YEARS OF CONTINUOUS JUDICIAL ADVOCACY
      </text>
    </g>
  </g>

  <!-- RIGHT SEAL: State Bar Council Badge -->
  <g transform="translate(1960, 230)">
    <circle cx="120" cy="110" r="95" fill="#081836" stroke="url(#goldGradient)" stroke-width="3" />
    <circle cx="120" cy="110" r="85" fill="none" stroke="url(#goldGradient)" stroke-width="1" stroke-dasharray="6,4" />
    <text x="120" y="85" text-anchor="middle" class="serif-title" font-size="14" fill="#cf9f38" letter-spacing="1">STATE BAR COUNCIL</text>
    <text x="120" y="105" text-anchor="middle" class="serif-title" font-size="15" fill="#ffffff" font-weight="800">MADHYA PRADESH</text>
    <path d="M 60 118 L 180 118" stroke="url(#goldGradient)" stroke-width="1.5" />
    <text x="120" y="138" text-anchor="middle" class="sans" font-size="13" font-weight="700" fill="#fdf1c8">ENROLLED ADVOCATE</text>
    <text x="120" y="158" text-anchor="middle" class="sans" font-size="12" font-weight="600" fill="#b0bccd">350+ eCourts Matters</text>
  </g>

  <!-- DIVIDER LINE -->
  <line x1="80" y1="465" x2="2320" y2="465" stroke="url(#goldGradient)" stroke-width="2" opacity="0.6" />
  <circle cx="1200" cy="465" r="7" fill="url(#goldGradient)" />

  <!-- PRACTICE AREAS RIBBON -->
  <g transform="translate(80, 520)">
    <text x="1120" y="0" text-anchor="middle" class="serif-title" font-size="20" fill="#cf9f38" letter-spacing="3">
      — PRINCIPAL PRACTICE AREAS &amp; JURISDICTION —
    </text>

    <!-- Practice Area Badges Grid -->
    <g transform="translate(20, 24)">
      <!-- Item 1 -->
      <g transform="translate(0, 0)">
        <rect width="420" height="54" rx="6" fill="#0d234a" stroke="rgba(212,175,55,0.4)" stroke-width="1.2" />
        <circle cx="28" cy="27" r="10" fill="url(#goldGradient)" />
        <text x="50" y="27" class="sans" font-size="18" font-weight="700" fill="#ffffff">Civil Suits &amp; Writs</text>
        <text x="50" y="44" class="hindi" font-size="13" fill="#cf9f38">दीवानी दावे, निषेधाज्ञा व रिट याचिका</text>
      </g>
      <!-- Item 2 -->
      <g transform="translate(450, 0)">
        <rect width="420" height="54" rx="6" fill="#0d234a" stroke="rgba(212,175,55,0.4)" stroke-width="1.2" />
        <circle cx="28" cy="27" r="10" fill="url(#goldGradient)" />
        <text x="50" y="27" class="sans" font-size="18" font-weight="700" fill="#ffffff">Land Revenue (MPLRC)</text>
        <text x="50" y="44" class="hindi" font-size="13" fill="#cf9f38">राजस्व न्यायालय, नामांतरण व बंटवारा</text>
      </g>
      <!-- Item 3 -->
      <g transform="translate(900, 0)">
        <rect width="420" height="54" rx="6" fill="#0d234a" stroke="rgba(212,175,55,0.4)" stroke-width="1.2" />
        <circle cx="28" cy="27" r="10" fill="url(#goldGradient)" />
        <text x="50" y="27" class="sans" font-size="18" font-weight="700" fill="#ffffff">Property &amp; Title Disputes</text>
        <text x="50" y="44" class="hindi" font-size="13" fill="#cf9f38">पैतृक संपत्ति, हक-हिस्सा व कब्जा विवाद</text>
      </g>
      <!-- Item 4 -->
      <g transform="translate(1350, 0)">
        <rect width="420" height="54" rx="6" fill="#0d234a" stroke="rgba(212,175,55,0.4)" stroke-width="1.2" />
        <circle cx="28" cy="27" r="10" fill="url(#goldGradient)" />
        <text x="50" y="27" class="sans" font-size="18" font-weight="700" fill="#ffffff">Criminal Defense &amp; Bail</text>
        <text x="50" y="44" class="hindi" font-size="13" fill="#cf9f38">जमानत, सेशन ट्रायल व अपील</text>
      </g>
      <!-- Item 5 -->
      <g transform="translate(1800, 0)">
        <rect width="420" height="54" rx="6" fill="#0d234a" stroke="rgba(212,175,55,0.4)" stroke-width="1.2" />
        <circle cx="28" cy="27" r="10" fill="url(#goldGradient)" />
        <text x="50" y="27" class="sans" font-size="18" font-weight="700" fill="#ffffff">Family &amp; Matrimonial</text>
        <text x="50" y="44" class="hindi" font-size="13" fill="#cf9f38">पारिवारिक विवाद व भरण-पोषण</text>
      </g>
    </g>
  </g>

  <!-- BOTTOM CHAMBER & CONTACT FOOTER BAR -->
  <g transform="translate(80, 675)">
    <!-- Base container -->
    <rect width="2240" height="150" rx="8" fill="#061328" stroke="url(#goldGradient)" stroke-width="1.8" />

    <!-- Column 1: Head Chamber (Ujjain) -->
    <g transform="translate(40, 28)">
      <text x="0" y="0" class="serif-title" font-size="16" fill="#cf9f38" letter-spacing="1.5">HEAD CHAMBER (UJJAIN)</text>
      <text x="0" y="26" class="sans" font-size="16" font-weight="700" fill="#ffffff">17-B Arihant Vikram Nagar, Sethi Nagar, Ujjain (M.P.) — 456010</text>
      <text x="0" y="52" class="hindi" font-size="14" fill="#a4b4cb">सेठी नगर, उज्जैन • उच्च न्यायालय व जिला न्यायालय</text>
      <text x="0" y="78" class="sans" font-size="14" font-weight="600" fill="#cf9f38">⏰ Mon – Sat: 10:00 AM – 8:00 PM (By Appointment)</text>
    </g>

    <!-- Column 2: Regional Chamber (Thandla / Jhabua) -->
    <g transform="translate(840, 28)">
      <text x="0" y="0" class="serif-title" font-size="16" fill="#cf9f38" letter-spacing="1.5">REGIONAL CHAMBER (THANDLA / JHABUA)</text>
      <text x="0" y="26" class="sans" font-size="16" font-weight="700" fill="#ffffff">Civil Court Campus, Near Tehsil Office, Thandla (Dist. Jhabua) — 457777</text>
      <text x="0" y="52" class="hindi" font-size="14" fill="#a4b4cb">सिविल कोर्ट परिसर, तहसील कार्यालय के पास, थांदला (झाबुआ)</text>
      <text x="0" y="78" class="sans" font-size="14" font-weight="600" fill="#cf9f38">⏰ Mon – Sat: 10:00 AM – 6:00 PM (Court Hours)</text>
    </g>

    <!-- Column 3: Direct Helpline / Contact CTA -->
    <g transform="translate(1700, 24)">
      <rect x="0" y="0" width="490" height="102" rx="6" fill="#0d234a" stroke="url(#goldGradient)" stroke-width="1.5" />
      <text x="245" y="28" text-anchor="middle" class="serif-title" font-size="14" fill="#cf9f38" letter-spacing="2">FOR APPOINTMENTS &amp; INQUIRIES</text>
      <g transform="translate(50, 40)">
        <!-- Phone symbol -->
        <circle cx="20" cy="20" r="16" fill="url(#goldGradient)" />
        <path d="M 14 12 C 14 11 15 10 16 10 L 18 10 C 19 10 20 11 20 12 L 21 15 C 21 16 21 17 20 17 L 19 18 C 19 20 20 21 22 23 L 23 22 C 24 21 25 21 26 21 L 29 22 C 30 22 31 23 31 24 L 31 26 C 31 27 30 28 29 28 C 21 28 14 21 14 13 Z" fill="#071329" />
        <text x="46" y="28" class="sans" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="1">+91 94254 86154</text>
      </g>
      <text x="245" y="92" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="#cf9f38">adv.tusharbhatt@gmail.com</text>
    </g>
  </g>
</svg>