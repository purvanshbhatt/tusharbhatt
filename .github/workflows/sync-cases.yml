name: Sync Latest eCourts Cases

on:
  schedule:
    # Runs automatically every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Sync eCourts Case Docket
        run: npm run sync-cases

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/latestCases.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(docket): automated sync of latest court cases [skip ci]" && git push origin main)

      - name: Build and Deploy to GitHub Pages
        run: |
          npm run build
          npm run deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
